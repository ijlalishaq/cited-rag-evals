name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  smoke-eval:
    # Offline mode: deterministic, no API keys or model downloads, so a drop means the code changed.
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: offline
      EMBEDDER: offline
      RERANKER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: data/corpus
          key: corpus-${{ hashFiles('scripts/fetch-corpus.ts') }}
      - run: test -n "$(ls data/corpus 2>/dev/null)" || pnpm corpus
      - run: pnpm ingest
      - run: pnpm check-gold
      - run: pnpm eval:smoke --label smoke-offline
      - name: Quality gate (fails on a drop of more than 2 points)
        run: pnpm gate --report "$GITHUB_WORKSPACE/evals-out/smoke-offline.json" --baseline baselines/smoke-offline.json
      - if: always()
        run: cat evals-out/smoke-offline.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval
          path: evals-out/
